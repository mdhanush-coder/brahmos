<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  /* 2-second end screen (user: "what is your opinion, mention in the comments"). charcoal-gold; gold only on the key word. */
  :root { --dark:#1C1C1C; --gold:#F5B700; --cream:#FFF8E6; --edge:rgba(255,248,230,0.35); }
  body { margin:0; }
  #root { position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--dark);
          font-family:'Space Grotesk','Hind',sans-serif; color:var(--cream); }
  #wrap { position:absolute; left:0; right:0; top:250px; display:flex; flex-direction:column; align-items:center; gap:34px; text-align:center; }
  .q   { font:700 128px/1.02 'Space Grotesk','Hind',sans-serif; letter-spacing:-0.02em; }
  .sub { font:600 56px/1.2 'Space Grotesk','Hind',sans-serif; opacity:0.95; }
  .cta { display:flex; align-items:center; gap:26px; padding:22px 44px; border-radius:24px; border:2px solid var(--edge);
         background:rgba(255,248,230,0.06); font:700 56px/1 'Space Grotesk','Hind',sans-serif; letter-spacing:0.06em; margin-top:18px; }
  .gold { color:var(--gold); }
  #bub { width:84px; height:84px; flex:none; }
</style>

<style>
  /* Designed background (Charcoal Gold): warm charcoal radial base, a breathing gold glow where the device sits, a faint
     dot grid fading to the edges, drifting dust, a vignette. The 3D plate (transparent, shadow kept) sits on top of it. */
  /* Color Palette rule: no colour outside the palette but the palette's own at lower opacity: charcoal ground, the gold
     glow at <= 16 %, cream grid and dust at low opacity. (The first version faded to black: not a palette colour.) */
  /* 2026-11-07: the user tried a navy "medical-tech" restyle and then said KEEP this background and theme. */
  #bg { position:absolute; inset:0; overflow:hidden; background:#1C1C1C; }
  #glow { position:absolute; left:calc(50% + 300px); top:52%; width:1100px; height:760px; margin:-380px 0 0 -550px; border-radius:50%;
          background:radial-gradient(closest-side, rgba(245,183,0,0.16), rgba(245,183,0,0.05) 55%, rgba(245,183,0,0) 100%); }
  #grid { position:absolute; inset:-40px; opacity:0.10;
          background-image:radial-gradient(circle, #FFF8E6 1.4px, transparent 1.6px); background-size:36px 36px;
          -webkit-mask-image:radial-gradient(ellipse 60% 60% at 50% 50%, #000 0%, transparent 100%);
                  mask-image:radial-gradient(ellipse 60% 60% at 50% 50%, #000 0%, transparent 100%); }
  #dust { position:absolute; inset:0; }
  #vig { position:absolute; inset:0; background:radial-gradient(ellipse 80% 80% at 60% 52%, rgba(245,183,0,0.05) 0%, rgba(245,183,0,0) 70%); }
  /* the device sits right of centre so the words in the left column never cover it (keepout_check.py uses these numbers) */
  #plate { position:absolute; inset:0; width:1920px; height:1080px; object-fit:cover; transform:translateX(300px) scale(0.78);
           transform-origin:50% 50%; }
</style>
</head>
<body>
<div id="root" data-composition-id="endcard" data-start="0" data-duration="2" data-width="1920" data-height="1080">
  
<div id="bg"><div id="glow"></div><div id="grid"></div><canvas id="dust" width="1920" height="1080"></canvas><div id="vig"></div></div>

  <div id="wrap">
    <div class="q" id="q1">What's your <span class="gold">opinion</span>?</div>
    <div class="sub" id="q2">Big discovery, or an expensive toy?</div>
    <div class="cta" id="q3">
      <svg id="bub" viewBox="0 0 84 84"><path d="M10 14 H74 V56 H44 L26 72 V56 H10 Z" fill="none" stroke="#FFF8E6" stroke-width="5" stroke-linejoin="round"/>
        <circle cx="28" cy="35" r="4" fill="#F5B700"/><circle cx="42" cy="35" r="4" fill="#F5B700"/><circle cx="56" cy="35" r="4" fill="#F5B700"/></svg>
      TELL US IN THE COMMENTS
    </div>
  </div>
</div>

<script>
  (function () {
    // dust: 70 seeded motes drifting up and sideways, drawn from the seek time only (never a clock)
    const g = document.getElementById('dust').getContext('2d');
    const motes = Array.from({ length: 70 }, () => ({ x: Math.random() * 1920, y: Math.random() * 1080, r: 0.8 + Math.random() * 2.2,
      vx: (Math.random() - 0.5) * 10, vy: -4 - Math.random() * 10, a: 0.10 + Math.random() * 0.25, ph: Math.random() * 6.28 }));
    function draw(t) {
      g.clearRect(0, 0, 1920, 1080);
      for (const m of motes) {
        const x = ((m.x + m.vx * t) % 1920 + 1920) % 1920, y = ((m.y + m.vy * t) % 1080 + 1080) % 1080;
        g.globalAlpha = m.a * (0.75 + 0.25 * Math.sin(m.ph + t * 0.8));
        g.fillStyle = '#FFF8E6';
        g.beginPath(); g.arc(x, y, m.r, 0, Math.PI * 2); g.fill();
      }
    }
    window.addEventListener('hf-seek', (e) => draw(e.detail.time));
    draw(0);
  })();
  window.__bgTween = function (tl, dur) {
    // the glow breathes, the grid drifts: slow, so the background never competes with the device or the words
    // under 5 % scale: the motion check flags a no-word element scaling 5 % while words are read (choreography.competing)
    tl.fromTo('#glow', { scale: 0.98, opacity: 0.85 }, { scale: 1.02, opacity: 1, duration: dur / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
    tl.fromTo('#grid', { x: 0, y: 0 }, { x: -36, y: -18, duration: dur, ease: 'none' }, 0);
  };
</script>
<script>
  // 2 s: three lines rise in one after another (0.4 s each, 0.25 s apart) and hold. No exit: the video ends on this card.
  const tl = gsap.timeline({ paused: true });
  gsap.set(['#q1', '#q2', '#q3'], { autoAlpha: 0 });
  const inn = (sel, t) => tl.fromTo(sel, { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power3.out' }, t);
  inn('#q1', 0.0); inn('#q2', 0.25); inn('#q3', 0.5);
  if (window.__bgTween) window.__bgTween(tl, 2.0);
  window.__timelines = { endcard: tl };
</script>
</body>
</html>
