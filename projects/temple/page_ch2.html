<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  /* ch2 "What is Temple": the ch1 turntable plate again on the right (the device being named), every word in the left column.
     charcoal-gold/dark, GOLD ONLY on the one word per frame (Temple, then $25M, then "your brain").
     Video sizes: display >= 72 px, lines read for meaning >= 48 px, labels >= 30 px. */
  :root { --dark:#1C1C1C; --gold:#F5B700; --cream:#FFF8E6; --edge:rgba(255,248,230,0.35); }
  body { margin:0; }
  #root { position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--dark);
          font-family:'Space Grotesk','Hind',sans-serif; color:var(--cream); }
  .note { position:absolute; left:136px; top:96px; font:italic 500 30px 'Space Grotesk','Hind',sans-serif; opacity:0.75; }
  .lab { font:600 30px 'Space Grotesk','Hind',sans-serif; letter-spacing:0.18em; opacity:0.7; }
  .big { font:700 128px/1 'Space Grotesk','Hind',sans-serif; letter-spacing:-0.02em; }
  .gold { color:var(--gold); }
  .line { font:600 56px/1.15 'Space Grotesk','Hind',sans-serif; text-wrap:balance; }
  .blk { position:absolute; left:136px; width:600px; display:flex; flex-direction:column; gap:18px; }
  #name { top:190px; }
  #maker { top:430px; }
  #m1 { top:190px; }
  #m2 { top:470px; }
  #m2 .big { font-size:96px; }
  .chip { position:absolute; left:136px; padding:16px 28px; border-radius:14px; background:rgba(28,28,28,0.86); border:2px solid var(--edge);
          font:600 48px/1.25 'Space Grotesk','Hind',sans-serif; }
  #ceo { bottom:150px; }
  #promise { top:190px; gap:28px; }
</style>

<style>
  /* Designed background (Charcoal Gold): warm charcoal radial base, a breathing gold glow where the device sits, a faint
     dot grid fading to the edges, drifting dust, a vignette. The 3D plate (transparent, shadow kept) sits on top of it. */
  /* Color Palette rule: no colour outside the palette but the palette's own at lower opacity: charcoal ground, the gold
     glow at <= 16 %, cream grid and dust at low opacity. (The first version faded to black: not a palette colour.) */
  /* 2026-11-07: the user tried a navy "medical-tech" restyle and then said KEEP this background and theme. */
  #bg { position:absolute; inset:0; overflow:hidden; background:#1C1C1C; }
  #glow { position:absolute; left:calc(50% + 300px); top:52%; width:1100px; height:760px; margin:-380px 0 0 -550px; border-radius:50%;
          background:radial-gradient(closest-side, rgba(245,183,0,0.16), rgba(245,183,0,0.05) 55%, rgba(245,183,0,0) 100%); }
  #grid { position:absolute; inset:-40px; opacity:0.10;
          background-image:radial-gradient(circle, #FFF8E6 1.4px, transparent 1.6px); background-size:36px 36px;
          -webkit-mask-image:radial-gradient(ellipse 60% 60% at 50% 50%, #000 0%, transparent 100%);
                  mask-image:radial-gradient(ellipse 60% 60% at 50% 50%, #000 0%, transparent 100%); }
  #dust { position:absolute; inset:0; }
  #vig { position:absolute; inset:0; background:radial-gradient(ellipse 80% 80% at 60% 52%, rgba(245,183,0,0.05) 0%, rgba(245,183,0,0) 70%); }
  /* the device sits right of centre so the words in the left column never cover it (keepout_check.py uses these numbers) */
  #plate { position:absolute; inset:0; width:1920px; height:1080px; object-fit:cover; transform:translateX(300px) scale(0.78);
           transform-origin:50% 50%; }
</style>
</head>
<body>
<div id="root" data-composition-id="ch2" data-start="0" data-duration="24.24" data-width="1920" data-height="1080">
  
<div id="bg"><div id="glow"></div><div id="grid"></div><canvas id="dust" width="1920" height="1080"></canvas><div id="vig"></div></div>
<video id="plate" src="assets/render.webm" muted playsinline data-start="0" data-duration="24.24"></video>
  <div class="note" id="note">3D illustration</div>
  <div class="blk" id="name"><div class="lab">ITS NAME</div><div class="big gold">Temple</div></div>
  <div class="blk" id="maker"><div class="lab">MADE BY</div><div class="line">Deepinder Goyal</div><div class="lab">FOUNDER OF ZOMATO</div></div>
  <div class="blk" id="m1"><div class="big gold">$25M</div><div class="lab">OF HIS OWN MONEY</div></div>
  <div class="blk" id="m2"><div class="big">+$54M</div><div class="lab">MORE RAISED</div></div>
  <div class="chip" id="ceo">Stepped down as<br>CEO of Eternal</div>
  <div class="blk" id="promise"><div class="lab">THE PROMISE</div>
    <div class="line">A wearable that estimates, live, all day, how much blood reaches <span class="gold">your brain</span></div></div>
</div>

<script>
  (function () {
    // dust: 70 seeded motes drifting up and sideways, drawn from the seek time only (never a clock)
    const g = document.getElementById('dust').getContext('2d');
    const motes = Array.from({ length: 70 }, () => ({ x: Math.random() * 1920, y: Math.random() * 1080, r: 0.8 + Math.random() * 2.2,
      vx: (Math.random() - 0.5) * 10, vy: -4 - Math.random() * 10, a: 0.10 + Math.random() * 0.25, ph: Math.random() * 6.28 }));
    function draw(t) {
      g.clearRect(0, 0, 1920, 1080);
      for (const m of motes) {
        const x = ((m.x + m.vx * t) % 1920 + 1920) % 1920, y = ((m.y + m.vy * t) % 1080 + 1080) % 1080;
        g.globalAlpha = m.a * (0.75 + 0.25 * Math.sin(m.ph + t * 0.8));
        g.fillStyle = '#FFF8E6';
        g.beginPath(); g.arc(x, y, m.r, 0, Math.PI * 2); g.fill();
      }
    }
    window.addEventListener('hf-seek', (e) => draw(e.detail.time));
    draw(0);
  })();
  window.__bgTween = function (tl, dur) {
    // the glow breathes, the grid drifts: slow, so the background never competes with the device or the words
    // under 5 % scale: the motion check flags a no-word element scaling 5 % while words are read (choreography.competing)
    tl.fromTo('#glow', { scale: 0.98, opacity: 0.85 }, { scale: 1.02, opacity: 1, duration: dur / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
    tl.fromTo('#grid', { x: 0, y: 0 }, { x: -36, y: -18, duration: dur, ease: 'none' }, 0);
  };
</script>
<script>
  // Chapter-relative word times (words_raghav_v2.json; ch2 starts at 24.28 s of the master). ONE entrance for every block:
  // rise 24 px, 0.5 s, power3.out; exits 0.4 s. The device turns on its own (plate); no other motion while words are read.
  const tl = gsap.timeline({ paused: true });
  gsap.set(['#note', '#name', '#maker', '#m1', '#m2', '#ceo', '#promise'], { autoAlpha: 0 });
  const inn = (sel, t) => tl.fromTo(sel, { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, t);
  const out = (sel, t) => tl.to(sel, { autoAlpha: 0, duration: 0.4, ease: 'power2.in' }, t);
  tl.to('#note', { autoAlpha: 0.75, duration: 0.6 }, 0.2);
  inn('#name', 0.75);                                     // "टेम्पल" (0.80)
  inn('#maker', 3.0);                                     // "ज़ोमैटो के फाउंडर दीपिंदर गोयल" (3.00)
  out(['#name', '#maker'], 5.9);
  inn('#m1', 7.15);                                       // "पच्चीस मिलियन डॉलर" (7.19)
  inn('#m2', 9.75);                                       // "चौवन मिलियन" (9.79)
  inn('#ceo', 13.75);                                     // "इटरनल के सी ई ओ ... छोड़ दिया" (13.77)
  out(['#m1', '#m2', '#ceo'], 16.2);
  inn('#promise', 17.05);                                 // "और वादा क्या है? एक ऐसा वियरेबल" (17.06)
  out(['#promise', '#note'], 23.75);
  if (window.__bgTween) window.__bgTween(tl, 24.24);
  window.__timelines = { ch2: tl };
</script>
</body>
</html>
