<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  /* ch8 "The gravity theory": no 3D. Left column = the theory as a 3-step chain, then the doctors' verdict and Goyal's reply.
     Right = the illustrated brain and heart (BrainKit): red pulses climb to the brain, gravity pulls down, then less of each pulse arrives.
     charcoal-gold/dark, GOLD ONLY on the one thing to notice per frame. Video sizes: lines >= 48 px, labels >= 30 px. */
  :root { --dark:#1C1C1C; --gold:#F5B700; --cream:#FFF8E6; --edge:rgba(255,248,230,0.35); }
  body { margin:0; }
  #root { position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--dark);
          font-family:'Space Grotesk','Hind',sans-serif; color:var(--cream); }
  .lab { font:600 30px 'Space Grotesk','Hind',sans-serif; letter-spacing:0.18em; opacity:0.7; }
  .line { font:600 56px/1.15 'Space Grotesk','Hind',sans-serif; text-wrap:balance; }
  .gold { color:var(--gold); }
  .blk { position:absolute; left:136px; width:640px; display:flex; flex-direction:column; gap:18px; }
  #theory { top:190px; }
  #chain { position:absolute; left:136px; top:470px; width:640px; display:flex; flex-direction:column; gap:22px; }
  .step { display:flex; align-items:center; gap:22px; font:600 48px/1.2 'Space Grotesk','Hind',sans-serif; }
  .step b { display:inline-flex; width:60px; height:60px; border-radius:30px; background:var(--cream); color:var(--dark);
            align-items:center; justify-content:center; font:700 32px 'Space Grotesk','Hind',sans-serif; flex:none; }
  #docs { top:190px; gap:40px; align-items:flex-start; }
  #docs .stamp { display:inline-block; box-sizing:content-box; padding:8px 26px 12px; border:6px solid var(--gold); border-radius:14px;
                 font:700 72px/1 'Space Grotesk','Hind',sans-serif; color:var(--gold); transform:rotate(-5deg); transform-origin:20% 50%; }
  #reply { top:560px; }
  #kit { position:absolute; left:1000px; top:80px; width:620px; height:950px; }
  #grav { position:absolute; left:1690px; top:300px; width:120px; height:520px; overflow:visible; }
  #grav text { fill:#FFF8E6; font:600 30px 'Space Grotesk','Hind',sans-serif; letter-spacing:0.18em; opacity:0.7; }
</style>

<style>
  /* Designed background (Charcoal Gold): warm charcoal radial base, a breathing gold glow where the device sits, a faint
     dot grid fading to the edges, drifting dust, a vignette. The 3D plate (transparent, shadow kept) sits on top of it. */
  /* Color Palette rule: no colour outside the palette but the palette's own at lower opacity: charcoal ground, the gold
     glow at <= 16 %, cream grid and dust at low opacity. (The first version faded to black: not a palette colour.) */
  /* 2026-11-07: the user tried a navy "medical-tech" restyle and then said KEEP this background and theme. */
  #bg { position:absolute; inset:0; overflow:hidden; background:#1C1C1C; }
  #glow { position:absolute; left:calc(50% + 300px); top:52%; width:1100px; height:760px; margin:-380px 0 0 -550px; border-radius:50%;
          background:radial-gradient(closest-side, rgba(245,183,0,0.16), rgba(245,183,0,0.05) 55%, rgba(245,183,0,0) 100%); }
  #grid { position:absolute; inset:-40px; opacity:0.10;
          background-image:radial-gradient(circle, #FFF8E6 1.4px, transparent 1.6px); background-size:36px 36px;
          -webkit-mask-image:radial-gradient(ellipse 60% 60% at 50% 50%, #000 0%, transparent 100%);
                  mask-image:radial-gradient(ellipse 60% 60% at 50% 50%, #000 0%, transparent 100%); }
  #dust { position:absolute; inset:0; }
  #vig { position:absolute; inset:0; background:radial-gradient(ellipse 80% 80% at 60% 52%, rgba(245,183,0,0.05) 0%, rgba(245,183,0,0) 70%); }
  /* the device sits right of centre so the words in the left column never cover it (keepout_check.py uses these numbers) */
  #plate { position:absolute; inset:0; width:1920px; height:1080px; object-fit:cover; transform:translateX(300px) scale(0.78);
           transform-origin:50% 50%; }
</style>
</head>
<body>
<div id="root" data-composition-id="ch8" data-start="0" data-duration="19.68" data-width="1920" data-height="1080">
  
<div id="bg"><div id="glow"></div><div id="grid"></div><canvas id="dust" width="1920" height="1080"></canvas><div id="vig"></div></div>

  <div class="blk" id="theory"><div class="lab">GOYAL'S THEORY</div><div class="line">The <span class="gold">Gravity</span> Ageing Hypothesis</div></div>
  <div id="chain">
    <div class="step" id="c1"><b>1</b>A lifetime upright</div>
    <div class="step" id="c2"><b>2</b>Less blood reaches the brain</div>
    <div class="step" id="c3"><b>3</b>We age faster</div>
  </div>
  <div class="blk" id="docs"><div class="lab">DOCTORS</div><div class="stamp" id="stamp">PSEUDOSCIENCE</div></div>
  <div class="blk" id="reply"><div class="lab">GOYAL</div><div class="line">Right or wrong, Temple is still useful</div></div>
  <div id="kit"></div>
  <svg id="grav" viewBox="0 0 120 520"><path d="M60 20 L60 440 M32 400 L60 452 L88 400" fill="none" stroke="#FFF8E6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="500" text-anchor="middle">GRAVITY</text></svg>
</div>
<script>
/* BrainKit: an illustrated brain for the Motion Graphic pages (user, 2026-11-07: "draw a sketch of a brain ... the signal
   should go red, green, blue ... the brain should be like pumping"). Lateral view, frontal lobe on the left.
   Everything is a function of the timeline time (update(t)), never a clock, so every render is identical.
   const B = BrainKit('#host', { heart:true, device:true });  B.drawOn(tl, t, dur);  B.flow(t0, t1, opts);  B.update(t)
   flow opts: period (s, one heartbeat), colors, reach(t) -> 0..1 (how much of each pulse gets to the brain; <1 = less blood). */
function BrainKit(sel, o) {
  o = Object.assign({ heart: false, device: false }, o || {});
  const NS = 'http://www.w3.org/2000/svg', H = o.heart ? 980 : 600;
  const host = document.querySelector(sel);
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 640 ${H}`); svg.style.width = '100%'; svg.style.height = '100%'; svg.style.overflow = 'visible';
  host.appendChild(svg);
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; };
  const defs = el('defs', {});
  defs.innerHTML = `<radialGradient id="bkGlow" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="bkSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="bkBloom" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
  const CREAM = '#FFF8E6';
  // ---- the brain (group that pumps) ----
  const brain = el('g', { id: 'bkBrain' });
  const glow = el('ellipse', { cx: 320, cy: 210, rx: 300, ry: 220, fill: 'url(#bkGlow)', opacity: 0 }, brain);
  const tint = el('path', { d: '', fill: '#F0412E', opacity: 0 }, brain);
  const OUT = 'M60,250 C40,170 90,80 190,55 C260,30 340,28 410,45 C500,65 565,120 580,200 C592,260 575,300 545,320 C520,338 490,340 470,335 C455,360 420,372 390,365 C370,362 350,350 340,338 C300,345 250,345 215,335 C180,345 140,340 110,320 C80,302 64,280 60,250 Z';
  tint.setAttribute('d', OUT);
  const ink = [];
  const line = (d, w, op) => { const p = el('path', { d, fill: 'none', stroke: CREAM, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: op }, brain); ink.push(p); return p; };
  line(OUT, 4, 1);
  line('M470,335 C500,340 540,350 545,380 C548,410 515,425 480,420 C450,416 430,400 425,382 C423,368 440,352 470,335 Z', 3.5, 1);   // cerebellum
  line('M385,362 C392,400 396,440 392,486 M345,345 C350,400 352,440 355,486', 3.5, 1);                                                // brainstem
  line('M150,290 C210,265 270,250 330,245 C360,243 380,232 395,215', 3, 0.9);                                                           // lateral fissure
  line('M330,48 C320,90 335,130 320,170 C310,200 318,225 310,250', 3, 0.9);                                                            // central sulcus
  for (const d of ['M120,120 C150,105 170,130 200,115 S250,100 270,125', 'M100,190 C130,170 160,200 190,180 S240,160 270,185',
                   'M150,80 C175,70 190,92 215,80', 'M380,80 C400,110 430,95 450,125 S480,150 500,140', 'M370,150 C400,170 420,150 445,180 S490,200 520,190',
                   'M420,240 C450,225 480,250 510,235 S545,240 560,255', 'M200,300 C230,285 260,305 290,290', 'M90,250 C110,235 130,260 150,245',
                   'M230,215 C250,200 270,222 290,210', 'M455,60 C480,80 470,100 500,110', 'M520,140 C540,160 530,180 555,200'])
    line(d, 2.4, 0.55);                                                                                                                  // gyri
  for (const d of ['M440,375 C470,365 510,370 540,380', 'M445,395 C475,388 505,392 535,400', 'M455,410 C480,405 505,408 525,414'])
    line(d, 2, 0.55);                                                                                                                    // cerebellar folia
  // ---- arteries: a trunk up the neck into the base of the brain, four branches over the surface ----
  const trunkD = o.heart ? 'M300,860 C296,760 304,640 300,520 C298,440 302,380 300,330' : 'M300,600 C300,500 305,400 300,330';
  const vessels = [trunkD, 'M300,330 C270,280 220,220 150,160', 'M300,330 C320,260 360,180 400,110', 'M300,330 C360,300 450,260 530,220', 'M300,330 C250,320 180,300 110,260']
    .map((d, i) => el('path', { d, fill: 'none', stroke: '#F0412E', 'stroke-width': i ? 5 : 9, 'stroke-linecap': 'round', opacity: 0.55 }, i ? brain : svg));
  vessels.forEach(v => ink.push(v));
  // ---- scalp artery (orange): runs under the device, up the side of the head (only with the device) ----
  const scalp = o.device ? el('path', { d: 'M105,500 C125,430 140,370 150,300 C158,240 165,180 185,110', fill: 'none', stroke: '#FF7A2F',
                                        'stroke-width': 6, 'stroke-linecap': 'round', opacity: 0, filter: 'url(#bkBloom)' }) : null;
  const LS = scalp ? scalp.getTotalLength() : 1;
  // ---- heart (optional) ----
  let heart = null;
  if (o.heart) {
    heart = el('g', {});
    el('path', { d: 'M300,955 C210,890 190,830 235,805 C265,790 292,805 300,825 C308,805 335,790 365,805 C410,830 390,890 300,955 Z',
                 fill: 'rgba(240,65,46,0.18)', stroke: '#F0412E', 'stroke-width': 4, 'stroke-linejoin': 'round' }, heart);
    heart.style.transformOrigin = '300px 870px'; heart.style.transformBox = 'view-box';
  }
  // ---- Temple device (optional): gold bean on the side of the head, light rings into the head ----
  let rings = [], dev = null;
  if (o.device) {
    dev = el('ellipse', { cx: 150, cy: 300, rx: 34, ry: 18, fill: '#F5B700', stroke: '#FFE29A', 'stroke-width': 2 });
    for (let i = 0; i < 6; i++) rings.push(el('circle', { cx: 150, cy: 300, r: 10, fill: 'none', 'stroke-width': 3, opacity: 0, filter: 'url(#bkBloom)' }));
  }
  // ---- signal pulses: a pool of glowing dots (head + 2 tail dots) ----
  const pool = [];
  for (let i = 0; i < 40; i++) pool.push([0, 1, 2].map(k => el('circle', { r: [8, 5.5, 3.5][k], fill: '#fff', opacity: 0, filter: 'url(#bkBloom)' })));
  brain.style.transformOrigin = '320px 220px'; brain.style.transformBox = 'view-box';
  const L = vessels.map(v => v.getTotalLength());
  const flows = [];
  const api = {
    svg, brain, heart, dev, ink, vessels, scalp,
    flowScalp(t0, t1, f) { flows.push(Object.assign({ t0, t1, period: 0.9, colors: ['#FF7A2F'], reach: () => 1, up: 0.6, out: 0.0, scalp: true }, f)); },
    drawOn(tl, t, dur) {   // the sketch draws itself, outline first, then folds, then vessels
      ink.forEach((p, i) => { const len = p.getTotalLength(); gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });
        tl.to(p, { strokeDashoffset: 0, duration: dur * 0.6, ease: 'power2.inOut' }, t + dur * 0.4 * (i / ink.length)); });
    },
    flow(t0, t1, f) { flows.push(Object.assign({ t0, t1, period: 0.86, colors: ['#F0412E', '#2BD45A', '#3A7BFF'], reach: () => 1, up: 0.55, out: 0.45 }, f)); },
    update(t) {
      let used = 0, flash = 0, flashCol = null, beat = 0;
      rings.forEach(r => r.setAttribute('opacity', 0));
      for (const f of flows) {
        if (t < f.t0 - 0.01 || t > f.t1 + f.up + f.out + 0.6) continue;
        const n = Math.floor((Math.min(t, f.t1) - f.t0) / f.period);
        for (let k = Math.max(0, n - 2); k <= n; k++) {
          const te = f.t0 + k * f.period; if (te > f.t1) break;
          const age = t - te; if (age < 0) continue;
          beat = Math.max(beat, Math.exp(-age / 0.18));
          const col = f.colors[k % f.colors.length], reach = f.reach(te);
          if (f.scalp) {   // a lit dot rides the scalp artery from the neck up past the device; no brain flash
            const u = age / (f.up + 0.5);
            if (u <= 1 && scalp && used < pool.length) {
              const dots = pool[used++];
              dots.forEach((d, j) => { const p = scalp.getPointAtLength(Math.max(0, u - j * 0.05) * LS);
                d.setAttribute('cx', p.x); d.setAttribute('cy', p.y); d.setAttribute('fill', col); d.setAttribute('opacity', (1 - j * 0.3)); });
            }
            continue;
          }
          // trunk, then all four branches at once
          const parts = age < f.up ? [[0, age / f.up]] : [1, 2, 3, 4].map(b => [b, (age - f.up) / f.out]);
          for (const [vi, u] of parts) {
            if (u > 1 || used >= pool.length) continue;
            const fade = vi === 0 ? 1 : Math.max(0, Math.min(1, (reach - u) / 0.15 + 1)) * (reach > 0 ? 1 : 0);
            const dots = pool[used++];
            dots.forEach((d, j) => { const uu = Math.max(0, u - j * 0.035), p = vessels[vi].getPointAtLength(uu * L[vi]);
              d.setAttribute('cx', p.x); d.setAttribute('cy', p.y); d.setAttribute('fill', col);
              d.setAttribute('opacity', (1 - j * 0.3) * fade * (vi === 0 && u < 0.05 ? u / 0.05 : 1)); });
          }
          const ta = te + f.up + f.out;   // the pulse lands: the brain lights in its colour
          if (t >= ta) { const v = Math.exp(-(t - ta) / 0.4) * reach; if (v > flash) { flash = v; flashCol = col; } }
          if (dev && age < 1.2) { const r = rings[k % rings.length], a = age / 1.2;
            r.setAttribute('r', 14 + a * 120); r.setAttribute('stroke', col); r.setAttribute('opacity', (1 - a) * 0.9); }
        }
      }
      for (let i = used; i < pool.length; i++) pool[i].forEach(d => d.setAttribute('opacity', 0));
      glow.setAttribute('opacity', 0.10 + 0.30 * flash);
      tint.setAttribute('opacity', 0.28 * flash);
      if (flashCol) tint.setAttribute('fill', flashCol);
      brain.style.transform = `scale(${1 + 0.03 * flash})`;           // the brain "pumps" as each pulse arrives
      if (heart) heart.style.transform = `scale(${1 + 0.08 * beat})`;  // the heart beats as each pulse leaves
    },
  };
  return api;
}
</script>


<script>
  (function () {
    // dust: 70 seeded motes drifting up and sideways, drawn from the seek time only (never a clock)
    const g = document.getElementById('dust').getContext('2d');
    const motes = Array.from({ length: 70 }, () => ({ x: Math.random() * 1920, y: Math.random() * 1080, r: 0.8 + Math.random() * 2.2,
      vx: (Math.random() - 0.5) * 10, vy: -4 - Math.random() * 10, a: 0.10 + Math.random() * 0.25, ph: Math.random() * 6.28 }));
    function draw(t) {
      g.clearRect(0, 0, 1920, 1080);
      for (const m of motes) {
        const x = ((m.x + m.vx * t) % 1920 + 1920) % 1920, y = ((m.y + m.vy * t) % 1080 + 1080) % 1080;
        g.globalAlpha = m.a * (0.75 + 0.25 * Math.sin(m.ph + t * 0.8));
        g.fillStyle = '#FFF8E6';
        g.beginPath(); g.arc(x, y, m.r, 0, Math.PI * 2); g.fill();
      }
    }
    window.addEventListener('hf-seek', (e) => draw(e.detail.time));
    draw(0);
  })();
  window.__bgTween = function (tl, dur) {
    // the glow breathes, the grid drifts: slow, so the background never competes with the device or the words
    // under 5 % scale: the motion check flags a no-word element scaling 5 % while words are read (choreography.competing)
    tl.fromTo('#glow', { scale: 0.98, opacity: 0.85 }, { scale: 1.02, opacity: 1, duration: dur / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
    tl.fromTo('#grid', { x: 0, y: 0 }, { x: -36, y: -18, duration: dur, ease: 'none' }, 0);
  };
</script>
<script>
  // Chapter-relative word times (words_raghav_v2.json; ch8 starts at 230.70 s of master v3). ONE entrance for every block:
  // rise 24 px, 0.5 s, power3.out; exits 0.4 s. The blood path is drawn upward once ("दिमाग़ तक"), then its top half
  // thins out on "कम पहुँचता": each pulse now reaches only a third of the way over the brain (the claim itself).
  const tl = gsap.timeline({ paused: true });
  gsap.set(['#theory', '#c1', '#c2', '#c3', '#docs', '#reply', '#grav'], { autoAlpha: 0 });
  const inn = (sel, t) => tl.fromTo(sel, { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, t);
  const out = (sel, t) => tl.to(sel, { autoAlpha: 0, duration: 0.4, ease: 'power2.in' }, t);
  const B = BrainKit('#kit', { heart: true });
  inn('#theory', 0.0);                                  // "इसके पीछे एक थ्योरी" ... "ग्रैविटी एजिंग हाइपोथिसिस" (0.02-3.8)
  B.drawOn(tl, 1.9, 1.8);                               // the brain and its vessels sketch themselves in
  B.flow(3.0, 8.3, { period: 0.9, colors: ['#F0412E'] });                 // the heart sends blood up to the brain: full strength
  inn('#c1', 6.3);                                      // "ज़िंदगी भर सीधे खड़े रहने से" (6.44)
  inn('#grav', 7.3);                                    // "सीधे खड़े" (7.33): gravity pulls down
  inn('#c2', 8.35);                                     // "दिमाग़ तक ख़ून कम पहुँचता है" (8.41-9.69)
  B.flow(8.9, 12.0, { period: 0.9, colors: ['#F0412E'], reach: () => 0.3 });   // "कम पहुँचता": only a third of each pulse now gets there
  inn('#c3', 10.35);                                     // "इसी से हम जल्दी बूढ़े होते हैं" (10.36)
  out(['#theory', '#c1', '#c2', '#c3'], 12.0);
  tl.set('#docs', { autoAlpha: 1 }, 12.3);
  tl.fromTo('#docs .lab', { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 12.3);   // "डॉक्टरों ने" (12.31)
  tl.fromTo('#stamp', { autoAlpha: 0, scale: 1.4, rotation: -1 }, { autoAlpha: 1, scale: 1, rotation: -5, duration: 0.18, ease: 'power4.in' }, 13.2)  // "स्यूडोसाइंस" (13.80)
    .to('#stamp', { keyframes: [{ x: 6, duration: 0.04 }, { x: -4, duration: 0.04 }, { x: 0, duration: 0.05 }] }, 13.38);
  inn('#reply', 14.7);                                  // "और गोयल भी मानते हैं" (15.24)
  out(['#docs', '#reply', '#kit', '#grav'], 19.2);
  out('#grav', 12.0);
  const upd = t => B.update(t);
  window.addEventListener('hf-seek', e => upd(e.detail.time));
  tl.eventCallback('onUpdate', () => upd(tl.time()));
  upd(0);
  if (window.__bgTween) window.__bgTween(tl, 19.68);
  window.__timelines = { ch8: tl };
</script>
</body>
</html>
